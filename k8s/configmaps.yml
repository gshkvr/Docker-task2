  RESOURCES_DB_PORT: "5432"
  RESOURCES_MS_PORT: "8080"
  SONGS_MS_URL: songs-ms
  SONGS_MS_PORT: "8081"
  SPRING_JPA_HIBERNATE_DDL_AUTO: none