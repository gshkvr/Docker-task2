apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-ms
  namespace: k8s-program
  annotations:
    kubernetes.io/change-cause: "v4.0 from Docker Hub"
spec:
  replicas: 2                      # две копии пода
  revisionHistoryLimit: 5          # сколько старых ReplicaSet'ов хранить для отката
  minReadySeconds: 10              # под должен простоять готовым 10 с, прежде чем идти дальше
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                  # максимум 1 лишний под во время обновления
      maxUnavailable: 0            # ни одного недоступного: сначала новый, потом удаляем старый
  selector:
    matchLabels:
      app: songs-ms                # какими подами управляет Deployment
  template:                        # шаблон пода
    metadata:
      labels:
        app: songs-ms              # метка должна совпадать с selector
    spec:
      enableServiceLinks: false    # чтобы Kubernetes сам не добавил в под переменную
      containers:
        - name: songs-ms
          image: gshkvr/songs-service:4.0
          imagePullPolicy: IfNotPresent   # брать локальный образ, не качать из интернета
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: songs-storage                         # то же имя, что в volumes ниже
              mountPath: /data                            # папка приложения на постоянном томе (PV/PVC)
          envFrom:                       # все ключи ConfigMap становятся переменными
            - configMapRef:
                name: songs-config
          env:                           # логин и пароль точечно из Secret
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          startupProbe:                    # ждём, пока Spring поднимется
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 3
            failureThreshold: 30           # до 90 секунд на старт
          livenessProbe:                   # приложение не зависло?
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3            # 30 секунд без ответа — рестарт
          readinessProbe:                  # готово принимать трафик (и база доступна)?
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: songs-storage
          persistentVolumeClaim:
            claimName: songs-pvc           # ссылка на PVC ниже
---
apiVersion: v1
kind: Service
metadata:
  name: songs-ms                   # по этому имени resources-service найдёт songs
  namespace: k8s-program
spec:
  type: NodePort
  selector:
    app: songs-ms                  # трафик идёт на поды с этой меткой
  ports:
    - port: 8081                   # порт Service внутри кластера
      targetPort: 8081             # порт контейнера
      nodePort: 30081              # порт снаружи (30000–32767)
---
# PersistentVolumeClaim - запрос пода на хранилище. Привязывается к PV с тем же storageClassName.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: songs-pvc
  namespace: k8s-program
spec:
  storageClassName: manual
  volumeName: songs-pv               # привязать именно к нашему PV
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
