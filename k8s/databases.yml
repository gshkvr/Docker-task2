apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: songs-db
  namespace: k8s-program
spec:
  replicas: 1
  serviceName: songs-db
  selector:
    matchLabels:
      app: songs-db
  template:
    metadata:
      labels:
        app: songs-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:            # взять одно значение из Secret
                  name: db-credentials   # имя Secret
                  key: username          # ключ внутри него
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql                          # SQL из ConfigMap: Postgres выполнит его при первом запуске
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:                                        # обычные тома пода (не PVC)
        - name: init-sql
          configMap:
            name: songs-db-init
  volumeClaimTemplates:
    - metadata:
        name: db-data                 # имя шаблона; PVC будет называться db-data-songs-db-0
      spec:
        storageClassName: local-path    # класс из kubectl get storageclass
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: songs-db
  namespace: k8s-program
spec:
  type: ClusterIP
  selector:
    app: songs-db
  ports:
    - port: 5432
      targetPort: 5432
---
