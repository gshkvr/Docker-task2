apiVersion: apps/v1
kind: Deployment
metadata:
  name: resources-ms
  namespace: k8s-program
spec:
  replicas: 2                      # две копии пода
  selector:
    matchLabels:
      app: resources-ms                # какими подами управляет Deployment
  template:                        # шаблон пода
    metadata:
      labels:
        app: resources-ms              # метка должна совпадать с selector
    spec:
      enableServiceLinks: false    # чтобы Kubernetes сам не добавил в под переменную
      containers:
        - name: resources-ms
          image: resources-image:3.0
          imagePullPolicy: IfNotPresent   # брать локальный образ, не качать из интернета
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: resources-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          startupProbe:                    # ждём, пока Spring поднимется
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 3
            failureThreshold: 30           # до 90 секунд на старт
          livenessProbe:                   # приложение не зависло?
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3            # 30 секунд без ответа — рестарт
          readinessProbe:                  # готово принимать трафик (и база доступна)?
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: resources-ms                   # по этому имени сервис доступен внутри кластера
  namespace: k8s-program
spec:
  type: NodePort
  selector:
    app: resources-ms                  # трафик идёт на поды с этой меткой
  ports:
    - port: 8080                   # порт Service внутри кластера
      targetPort: 8080             # порт контейнера
      nodePort: 30080              # порт снаружи (30000–32767)